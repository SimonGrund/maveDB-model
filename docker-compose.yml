version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Docker/Dockerfile_server
      # Uncomment to force x86_64 build on Apple Silicon (slower)
      # platform: linux/amd64
    image: mavedb-model-server:latest
    container_name: mavedb-model-server
    working_dir: /app
    volumes:
      - ./Shared:/app/Shared
      - ./tmp:/app/tmp
    # Use run.sh as entrypoint
    entrypoint: ["/app/run.sh"]
  
  client:
    build:
      context: .
      dockerfile: Docker/Dockerfile_client
      # Uncomment to force x86_64 build on Apple Silicon (slower)
      # platform: linux/amd64
    image: mavedb-model-client:latest
    container_name: mavedb-model-client
    working_dir: /app
    volumes:
      - ./Shared:/app/Shared
    # Use run.sh as entrypoint
    entrypoint: ["/app/run.sh"]
